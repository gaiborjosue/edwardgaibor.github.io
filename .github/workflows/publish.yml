name: publish-to-github-pages
on:
  push:
    branches:
      - updated_v3

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4



      - name: Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧
        uses: ./.github/workflows/setup-node

      - name: Build with Next.js 🏗️
        run: npx next build

      - name: Check if out path exists
        id: check_out_path
        run: |
          if [ -d "./out" ]; then
            echo "out path exists"
            echo "exists=true" >> $GITHUB_ENV
          else
            echo "out path does not exist"
            echo "exists=false" >> $GITHUB_ENV
          fi

      - name: Check if out path exists v2
        id: check_out_path_v2
        run: |
          cd ..
          ls -la
          cd ..
          ls -la

      - name: Upload artifact 📡
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4